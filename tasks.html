<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未接订单 · Aevon校园</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="ui.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font:15px/1.6 -apple-system,'Microsoft YaHei',sans-serif}header{background:#1e3a8a;color:white;padding:16px 20px}nav,main{max-width:1000px;margin:auto}nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#1e3a8a}nav a{color:white;text-decoration:none}main{padding:30px 18px}h1{margin:0;font-size:28px}.sub,small{color:#64748b}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 12px}input,select,button{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:white}input{flex:1;min-width:150px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin:12px 0;overflow-wrap:anywhere}.card h2{font-size:18px;margin:10px 0;white-space:pre-wrap}.channel{background:#eef2ff;color:#3730a3;padding:3px 9px;border-radius:7px;font-size:12px}.price{color:#b45309;font-weight:700}.actions,.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{margin-top:16px}.claim{background:#1e3a8a;color:white}.pager{margin:24px 0}.notice{padding:20px;background:white;border-radius:12px;color:#64748b}#status{min-height:24px;color:#64748b}#error{color:#b91c1c}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}@media(max-width:600px){main{padding:22px 14px}.card{padding:16px}.tools select{flex:1;min-width:120px}}
</style></head><body><header><nav><a href="index.html">🎓 Aevon校园交流网</a><span><a href="chat.html">发布任务</a> · <a href="me.html">个人中心</a></span></nav></header><main><h1>📋 未接订单</h1><p class="sub">所有频道尚未被接取、仍可接单的任务，都在这里。</p><form class="tools" id="filters"><input id="query" maxlength="50" placeholder="搜索任务、地点或报酬" aria-label="搜索任务"><select id="channel" aria-label="筛选频道"><option value="">全部频道</option></select><select id="sort" aria-label="排序"><option value="new">最新发布</option><option value="deadline">截止时间最近</option></select><button type="submit">查找</button><button type="button" id="refresh">刷新</button></form><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p><div id="list" aria-busy="true"></div><div class="pager"><button id="prev" type="button" disabled>上一页</button><span id="pageLabel"></span><button id="next" type="button" disabled>下一页</button></div></main><script src="session.js"></script><script src="config.js"></script><script src="pwa.js" defer></script><script>
const base=window.API_BASE||'',list=document.getElementById('list'),statusEl=document.getElementById('status'),errorEl=document.getElementById('error'),query=document.getElementById('query'),channel=document.getElementById('channel'),sort=document.getElementById('sort'),prev=document.getElementById('prev'),next=document.getElementById('next');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page=1,pages=1,seq=0,loading=false,rows=[],busy=new Set();
function params(){return new URLSearchParams({status:'open',page:String(page),limit:'20',channel:channel.value,q:query.value.trim(),sort:sort.value})}
function draw(){list.innerHTML=rows.map(m=>`<article class="card"><span class="channel">${esc(m.channel)}</span><h2>${esc(m.text)}</h2><p class="price">${esc(m.reward||'报酬待协商')}${m.bonusPoints?' · '+Number(m.bonusPoints)+' 积分奖励':''}</p><p>${esc(m.place||'地点未填写')} · 截止：${m.deadline?esc(new Date(m.deadline).toLocaleString('zh-CN')):'未设置'}</p><small>发布人：${esc(m.user)} · ${esc(new Date(m.time).toLocaleString('zh-CN'))}</small><div class="actions"><a href="chat.html#${encodeURIComponent(m.channel)}">查看频道 / 讨价</a><button type="button" class="claim" data-id="${esc(m.id)}" ${busy.has(String(m.id))?'disabled':''}>${m.user===localStorage.getItem('username')?'我发布的任务':'接单'}</button></div></article>`).join('')||'<p class="notice">当前条件下没有待接任务，可以换个频道或清空搜索再看看。</p>';list.querySelectorAll('[data-id]').forEach(b=>{const m=rows.find(x=>String(x.id)===b.dataset.id);if(m.user===localStorage.getItem('username'))b.disabled=true;else b.onclick=()=>claim(m)})}
async function load(){const version=++seq;loading=true;list.setAttribute('aria-busy','true');prev.disabled=next.disabled=true;statusEl.textContent='正在读取待接任务…';errorEl.textContent='';try{const r=await fetch(base+'/api/tasks?'+params(),{cache:'no-store'}),d=await r.json();if(version!==seq)return;if(!r.ok)throw new Error(d.error||'任务加载失败');rows=d.tasks;page=d.page;pages=d.pages;draw();statusEl.textContent='共 '+d.total+' 个待接任务 · 每页 20 条';document.getElementById('pageLabel').textContent=page+' / '+pages}catch(e){if(version===seq){errorEl.textContent=e.message+'，请点刷新重试。';statusEl.textContent='加载失败，已有列表可能不是最新状态。'}}finally{if(version===seq){loading=false;list.setAttribute('aria-busy','false');prev.disabled=page<=1;next.disabled=page>=pages}}}
async function claim(m){const token=localStorage.getItem('token');if(!token){location.href='login.html?next=tasks.html';return}if(busy.has(String(m.id)))return;if(!confirm('确认接取这条任务吗？接单可能按站内规则扣除积分。\n涉及人民币的报酬由双方自行结算，平台不托管资金；请先核对任务内容、地点和报酬。'))return;busy.add(String(m.id));draw();try{const r=await fetch(base+'/api/channels/'+encodeURIComponent(m.channel)+'/messages/'+encodeURIComponent(m.id)+'/claim',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:'{}'}),d=await r.json();if(!r.ok)throw new Error(d.error||'接单失败');location.href='chat.html?task='+encodeURIComponent(m.id)+'#'+encodeURIComponent(m.channel)}catch(e){errorEl.textContent=e.message;await load();errorEl.textContent=e.message}finally{busy.delete(String(m.id));draw()}}
document.getElementById('filters').onsubmit=e=>{e.preventDefault();page=1;load()};channel.onchange=sort.onchange=()=>{page=1;load()};document.getElementById('refresh').onclick=()=>load();prev.onclick=()=>{page--;load()};next.onclick=()=>{page++;load()};document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(()=>{if(!document.hidden&&!loading&&!busy.size)load()},30000);
fetch(base+'/api/channels').then(r=>{if(!r.ok)throw new Error();return r.json()}).then(chs=>chs.forEach(c=>{const o=document.createElement('option');o.value=o.textContent=c.name;channel.append(o)})).catch(()=>{});load();
</script></body></html>
