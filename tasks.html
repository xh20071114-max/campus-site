<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>可接任务 · Aevon校园</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="ui.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font:15px/1.6 -apple-system,'Microsoft YaHei',sans-serif}header{background:#1e3a8a;color:white;padding:16px 20px}nav,main{max-width:1000px;margin:auto}nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}a{color:#1e3a8a}nav a{color:white;text-decoration:none}main{padding:30px 18px}h1{margin:0;font-size:28px}.sub,small{color:#64748b}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 12px}input,select,button{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:white}input{flex:1;min-width:150px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin:12px 0;overflow-wrap:anywhere}.card h2{font-size:18px;margin:10px 0;white-space:pre-wrap}.channel{background:#eef2ff;color:#3730a3;padding:3px 9px;border-radius:7px;font-size:12px}.price{color:#b45309;font-weight:700}.actions,.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{margin-top:16px}.claim{background:#1e3a8a;color:white}.pager{margin:24px 0}.notice{padding:20px;background:white;border-radius:12px;color:#64748b}#status{min-height:24px;color:#64748b}#error{color:#b91c1c}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}@media(max-width:600px){main{padding:22px 14px}.card{padding:16px}.tools select{flex:1;min-width:120px}}
</style></head><body><header><nav><a href="index.html">🎓 Aevon校园交流网</a><span><a href="leaderboard.html">🏆 接单排行榜</a> · <a href="chat.html#任务大厅">发布任务</a> · <a href="chat.html#校园聊天">校园聊天</a> · <a href="me.html">个人中心</a></span></nav></header><main><h1>🔎 可接任务</h1><p class="sub">所有仍可接单的任务都会统一展示，可按关键词搜索或按截止时间排序。</p><form class="tools" id="filters"><input id="query" maxlength="50" placeholder="搜索任务、地点或报酬" aria-label="搜索任务"><select id="sort" aria-label="排序"><option value="new">最新发布</option><option value="deadline">截止时间最近</option></select><button type="submit">查找</button><button type="button" id="refresh">刷新</button></form><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert"></p><div id="pinnedTasks"></div><div id="list" aria-busy="true"></div><div class="pager"><button id="prev" type="button" disabled>上一页</button><span id="pageLabel"></span><button id="next" type="button" disabled>下一页</button></div></main><script src="session.js"></script><script src="config.js"></script><script src="pwa.js" defer></script><script>
const base=window.API_BASE||'',list=document.getElementById('list'),pinnedTasks=document.getElementById('pinnedTasks'),statusEl=document.getElementById('status'),errorEl=document.getElementById('error'),query=document.getElementById('query'),sort=document.getElementById('sort'),prev=document.getElementById('prev'),next=document.getElementById('next');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let page=1,pages=1,seq=0,loading=false,rows=[],busy=new Set(),claimCost=null,freeTasks=false,rulesReady=false,rulesError='';
function params(){return new URLSearchParams({status:'open',page:String(page),limit:'20',q:query.value.trim(),sort:sort.value})}
async function loadClaimRules(){if(errorEl.textContent===rulesError)errorEl.textContent='';rulesReady=false;rulesError='';claimCost=null;freeTasks=false;draw();try{const token=localStorage.getItem('token'),[settingsR,meR]=await Promise.all([fetch(base+'/api/settings',{cache:'no-store'}),token?fetch(base+'/api/me',{cache:'no-store',headers:{Authorization:'Bearer '+token}}):Promise.resolve(null)]);let settingCost=null;if(settingsR.ok){const s=await settingsR.json();settingCost=Number(s.claimCost)}if(meR&&meR.status!==401&&!meR.ok)throw new Error();if(meR&&meR.ok){const u=await meR.json();freeTasks=!!u.superAdmin||(u.permissions||[]).includes('freeTasks');if(Number.isSafeInteger(u.claimCost))claimCost=u.claimCost}if(claimCost===null)claimCost=settingCost;if(!Number.isSafeInteger(claimCost)||claimCost<0)throw new Error();rulesReady=true;rulesError=''}catch{rulesReady=false;rulesError='无法读取接单积分规则，请点“刷新”重试'}draw();if(rulesError&&!errorEl.textContent)errorEl.textContent=rulesError}
function drawPins(pins){const active=(pins||[]).filter(m=>m.task&&!m.deleted&&!m.cancelled);pinnedTasks.innerHTML=active.length?`<section class="card" style="border-color:#fecaca;border-left:5px solid #ef4444;background:#fffafa"><h2 style="color:#b91c1c;margin-top:0">📌 管理员置顶任务</h2>${active.map(m=>`<article style="padding:10px 0;border-top:1px solid #fee2e2"><span class="channel">任务</span><b style="margin-left:8px">${esc(m.status==='open'?'待接单':m.status==='done'?'已完成':m.status==='cancelled'?'已撤回':'进行中')}</b><p style="white-space:pre-wrap">${esc(m.text)}</p><small>${esc(m.user)} · ${esc(m.reward||'报酬待协商')} · ${esc(m.place||'地点未填写')}</small></article>`).join('')}<p class="sub" style="margin-bottom:0">每个频道最多置顶 3 条 · 管理员可在频道内管理置顶</p></section>`:''}
function draw(){list.innerHTML=rows.map(m=>`<article class="card"><span class="channel">任务</span><h2>${esc(m.text)}</h2><p class="price">${esc(m.reward||'报酬待协商')}${m.bonusPoints?' · '+Number(m.bonusPoints)+' 积分奖励':''}</p><p>${esc(m.place||'地点未填写')} · 截止：${m.deadline?esc(new Date(m.deadline).toLocaleString('zh-CN')):'未设置'}</p><small>发布人：${esc(m.user)} · ${esc(new Date(m.time).toLocaleString('zh-CN'))}</small><div class="actions"><a href="${m.user===localStorage.getItem('username')||localStorage.getItem('admin')==='1'?'chat.html#'+encodeURIComponent(m.channel):'chat.html?task='+encodeURIComponent(m.id)+'&inquiry=1#'+encodeURIComponent(m.channel)}">${m.user===localStorage.getItem('username')||localStorage.getItem('admin')==='1'?'查看任务大厅':'💬 咨询发布者'}</a><button type="button" class="claim" data-id="${esc(m.id)}" ${busy.has(String(m.id))||!rulesReady?'disabled':''}>${m.user===localStorage.getItem('username')?'我发布的任务':!rulesReady?(rulesError?'费用读取失败':'读取积分规则…'):freeTasks?'接单（免扣积分）':claimCost>0?`接单（扣 ${claimCost} 积分）`:'接单'}</button></div></article>`).join('')||'<p class="notice">当前条件下没有待接任务，可以清空搜索或刷新再看看。</p>';list.querySelectorAll('[data-id]').forEach(b=>{const m=rows.find(x=>String(x.id)===b.dataset.id);if(m.user===localStorage.getItem('username'))b.disabled=true;else b.onclick=()=>claim(m)})}
async function load(){const version=++seq;loading=true;list.setAttribute('aria-busy','true');prev.disabled=next.disabled=true;statusEl.textContent='正在读取待接任务…';errorEl.textContent='';try{const r=await fetch(base+'/api/tasks?'+params(),{cache:'no-store'}),d=await r.json();if(version!==seq)return;if(!r.ok)throw new Error(d.error||'任务加载失败');rows=d.tasks;page=d.page;pages=d.pages;draw();statusEl.textContent='共 '+d.total+' 个待接任务 · 每页 20 条';document.getElementById('pageLabel').textContent=page+' / '+pages;fetch(base+'/api/channels/'+encodeURIComponent('任务大厅')+'/pins',{cache:'no-store'}).then(async pr=>{if(version!==seq||!pr.ok)return;drawPins(await pr.json())}).catch(()=>{})}catch(e){if(version===seq){errorEl.textContent=e.message+'，请点刷新重试。';statusEl.textContent='加载失败，已有列表可能不是最新状态。'}}finally{if(version===seq){loading=false;list.setAttribute('aria-busy','false');prev.disabled=page<=1;next.disabled=page>=pages;if(rulesError&&!errorEl.textContent)errorEl.textContent=rulesError}}}
async function claim(m){const token=localStorage.getItem('token');if(!token){location.href='login.html?next=tasks.html';return}if(busy.has(String(m.id)))return;let me;try{const r=await fetch(base+'/api/me',{cache:'no-store',headers:{Authorization:'Bearer '+token}});if(r.status===401){location.href='login.html?next=tasks.html';return}if(!r.ok)throw new Error('暂时无法读取当前积分规则，请稍后重试');me=await r.json()}catch(e){errorEl.textContent=e.message||'网络异常，暂时无法核对接单费用';return}const exempt=!!me.superAdmin||(me.permissions||[]).includes('freeTasks'),fee=exempt?0:Number(me.claimCost??claimCost??0);if(!Number.isSafeInteger(fee)||fee<0){errorEl.textContent='无法核对当前接单费用，请刷新后重试';return}if(!exempt&&Number.isFinite(me.points)&&me.points<fee){errorEl.replaceChildren(document.createTextNode(`积分不足：当前 ${me.points} 分，接单需要 ${fee} 分。`));const a=document.createElement('a');a.href='recharge.html';a.textContent='去充值';a.style.marginLeft='6px';errorEl.append(a);return}const feeText=exempt?'本单免扣积分。':fee?`接取后将扣除 ${fee} 积分。`:'本单不扣积分。';if(!confirm(`确认接取这条任务？${feeText}\n涉及人民币的报酬由双方自行结算，平台不托管资金；请核对任务内容、地点和报酬。`))return;busy.add(String(m.id));draw();try{const r=await fetch(base+'/api/channels/'+encodeURIComponent(m.channel)+'/messages/'+encodeURIComponent(m.id)+'/claim',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:'{}'}),d=await r.json();if(!r.ok)throw new Error(d.error||'接单失败');location.href='chat.html?task='+encodeURIComponent(m.id)+'#'+encodeURIComponent(m.channel)}catch(e){await load();errorEl.textContent=e.message}finally{busy.delete(String(m.id));draw()}}
document.getElementById('filters').onsubmit=e=>{e.preventDefault();page=1;load()};sort.onchange=()=>{page=1;load()};document.getElementById('refresh').onclick=()=>{load();loadClaimRules()};prev.onclick=()=>{page--;load()};next.onclick=()=>{page++;load()};document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});setInterval(()=>{if(!document.hidden&&!loading&&!busy.size)load()},30000);
loadClaimRules();load();
</script></body></html>
