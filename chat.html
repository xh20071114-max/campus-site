function squeeze(file){return new Promise((ok,bad)=>{const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(u);let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,1000/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
