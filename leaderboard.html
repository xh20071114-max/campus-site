<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接单排行榜 · Aevon校园</title><link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1e3a8a"><link rel="stylesheet" href="ui.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}header{background:#1e3a8a;color:#fff;padding:14px 18px}nav,main{max-width:900px;margin:auto}nav,.links,.toolbar,.period,.dialog-actions{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}nav a{color:#fff;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}.links{gap:16px}main{padding:26px 16px}h1{margin:0;font-size:27px}h2{font-size:19px;margin:0}.sub,small,.muted{color:#64748b}.muted{font-size:13px}.panel{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin:16px 0}.period{align-items:start}.hint{background:#eff6ff;color:#1e40af;padding:12px 14px;border-radius:10px;margin:14px 0}.prize{color:#92400e;font-weight:700}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:#f8fafc;border-radius:10px;padding:11px 13px;overflow-wrap:anywhere}.rank{font-size:19px;font-weight:700;color:#1e3a8a}.btn{border:0;border-radius:9px;padding:10px 13px;background:#1e3a8a;color:white;font:inherit;cursor:pointer;min-height:44px}.btn.secondary{background:#e2e8f0;color:#1e3a8a}.btn:disabled{opacity:.55;cursor:default}.status{min-height:24px;margin:8px 0;color:#166534}.status.error{color:#b91c1c}.empty{padding:18px;color:#64748b;text-align:center}.row.mine{outline:2px solid #bfdbfe}.reward{margin:12px 0;padding:12px 0;border-top:1px solid #e2e8f0}.reward p{margin:0 0 8px}dialog{width:min(480px,calc(100% - 24px));max-height:90vh;overflow:auto;border:0;border-radius:16px;padding:22px;color:#1f2937}dialog::backdrop{background:#0f172a99}.dialog-actions{justify-content:flex-end;margin-top:16px}#qrPreview{display:block;max-width:100%;max-height:280px;margin:12px auto;object-fit:contain}#qrPreview[hidden]{display:none}.dialog-top{display:flex;justify-content:space-between;gap:12px;align-items:start}.dialog-top button{flex:none}#fileName{overflow-wrap:anywhere;margin:8px 0}@media(max-width:520px){main{padding:20px 12px}.panel{padding:14px}.row{grid-template-columns:32px minmax(0,1fr);gap:7px}.row-action{grid-column:2}.toolbar .btn{padding:8px 12px}nav{gap:6px}.links{gap:16px}.sub{font-size:14px}dialog{padding:16px}}
</style></head><body><header><nav><a href="index.html">🎓 Aevon校园交流网</a><span class="links"><a href="index.html">返回首页</a><a href="tasks.html">可接任务</a><a href="me.html">我的订单 / 个人中心</a></span></nav></header><main><div class="toolbar"><h1>🏆 接单排行榜</h1><button class="btn secondary" id="refresh" type="button">刷新排行榜</button></div><p class="sub">每完成一个任务计 1 次，榜单最多显示 10 人；次数相同，先达到者在前。北京时间周一 01:00 开始，周日 01:00 截止；截止后至下周一 01:00 完成的任务不计榜，仍可正常接单和完成任务。</p><p id="status" class="status" role="status" aria-live="polite"></p><div id="content" aria-busy="true"><p class="empty">正在读取排行榜…</p></div></main>
<dialog id="qrDialog" aria-labelledby="qrTitle"><div class="dialog-top"><h2 id="qrTitle">提交奖励收款码</h2><button class="btn secondary" id="closeQr" type="button">关闭</button></div><p id="qrPeriod" class="muted"></p><p>请在微信或支付宝收款页面点击“保存图片”，上传保存的原始收款码，尽量不要使用截图。</p><p class="muted" id="qrHelp">支持 PNG、JPEG 原图，最大 2MB。图片仅总管理员可查看，用于核对和打款。</p><input id="qrFile" type="file" accept="image/png,image/jpeg" hidden aria-label="选择收款码图片"><button class="btn secondary" id="chooseQr" type="button">选择收款码图片</button><p id="fileName" class="muted">尚未选择图片</p><img id="qrPreview" alt="本次选择的收款码预览" hidden><p id="qrStatus" class="status" role="status" aria-live="polite"></p><div class="dialog-actions"><button class="btn" id="sendQr" type="button" disabled>确认提交收款码</button></div></dialog>
<script src="session.js"></script><script src="config.js"></script><script src="pwa.js" defer></script><script>
const API=window.API_BASE||'',root=document.getElementById('content'),statusEl=document.getElementById('status'),refresh=document.getElementById('refresh'),dialog=document.getElementById('qrDialog'),picker=document.getElementById('qrFile'),preview=document.getElementById('qrPreview'),qrStatus=document.getElementById('qrStatus'),sendQr=document.getElementById('sendQr'),chooseQr=document.getElementById('chooseQr'),closeQr=document.getElementById('closeQr');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=x=>new Date(x).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
let loading=false,uploading=false,hasData=false,qrMaxBytes=2*1024*1024,selectedPeriod='',previewUrl='',selectedFile=null,pendingLoad=null;
async function call(path,opt={}){const headers={...(opt.headers||{})},token=localStorage.getItem('token');if(token)headers.Authorization='Bearer '+token;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),20000);try{const r=await fetch(API+path,{...opt,headers,signal:controller.signal,cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'请求失败'),{status:r.status});return d}catch(e){if(e.name==='AbortError')throw new Error('请求超时，请重试');throw e}finally{clearTimeout(timeout)}}
const award=r=>r.rank<=3?(r.eligible?'鼓励金 ¥'+Number(r.cash):'未达 20 单，暂无现金奖励'):r.rank<=10?'5 积分补贴':'—';
function qrButton(key,submitted){return `<button class="btn" type="button" data-qr="${esc(key)}">${submitted?'更换收款码':'提交收款码'}</button>`}
function rows(list,key,locked){return list.length?`<div class="rows">${list.map(r=>`<div class="row ${r.mine?'mine':''}"><div class="rank">${r.rank===1?'🥇':r.rank===2?'🥈':r.rank===3?'🥉':Number(r.rank)}</div><div><b>${esc(r.username)}${r.mine?'（我）':''}</b><div class="muted">完成 ${Number(r.count)} 个任务 · <span class="prize">${award(r)}</span></div>${r.mine&&r.qrSubmitted?'<small>收款码已私密提交</small>':''}</div><div class="row-action">${locked&&r.mine&&r.rank<=3&&r.eligible?(r.rewardStatus==='paid'?'<span class="muted">已登记打款</span>':qrButton(key,r.qrSubmitted)):''}</div></div>`).join('')}</div>`:'<div class="empty">本期还没有已完成任务</div>'}
function draw(d){qrMaxBytes=Number(d.qrMaxBytes)||2*1024*1024;let html='';if(d.live)html+=`<section class="panel"><div class="period"><h2>本周实时排行</h2><span class="muted">${date(d.live.startAt)} 至 ${date(d.live.endAt)}</span></div><div class="hint">前三名需本周完成至少 20 个任务，鼓励金分别为 10 元、5 元、3 元。第 4 至 10 名各得 5 积分，于下周一 01:00 发放。</div>${rows(d.live.rows,d.live.key,false)}</section>`;
if(d.locked)html+=`<section class="panel"><div class="period"><h2>${d.live?'上期结算结果':'本轮已截止'}</h2><span class="muted">${date(d.locked.startAt)} 至 ${date(d.locked.endAt)} · ${d.locked.pointsSent?'积分已发放':'积分在下周一 01:00 发放'}</span></div><p class="muted">现金由总管理员人工打款，预计截止当日周日 24:00 前处理；获奖者请及时提供收款码。已提交后可更换，登记打款后不能更换。</p>${rows(d.locked.rows,d.locked.key,true)}</section>`;
if(!d.live&&!d.locked)html='<section class="panel empty">当前还没有排行榜记录。</section>';
const inlineKey=d.locked?.rows.some(r=>r.mine&&r.rank<=3&&r.eligible&&r.rewardStatus!=='paid')?d.locked.key:null,due=(d.myRewards||[]).filter(r=>r.status!=='paid'&&r.key!==inlineKey);if(due.length)html+=`<section class="panel"><h2>我的其他待领取奖励</h2>${due.map(r=>`<div class="reward"><p><b>${esc(r.key)} 期</b> · 第 ${Number(r.rank)} 名 · ¥${Number(r.cash)}</p><p class="muted">${r.qrSubmitted?'收款码已私密提交，等待管理员打款':'请提供本期收款码'}</p>${qrButton(r.key,r.qrSubmitted)}</div>`).join('')}</section>`;
if(!localStorage.getItem('token'))html+='<p class="muted">登录后可查看自己的领奖入口。<a href="login.html?next=leaderboard.html">去登录</a></p>';root.innerHTML=html;root.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>openUpload(b.dataset.qr));}
function clearSelection(){if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl='';selectedFile=null;picker.value='';preview.hidden=true;preview.removeAttribute('src');document.getElementById('fileName').textContent='尚未选择图片';sendQr.disabled=true;qrStatus.textContent='';qrStatus.classList.remove('error')}
function openUpload(key){if(!localStorage.getItem('token')){location.href='login.html?next=leaderboard.html';return}selectedPeriod=key;clearSelection();document.getElementById('qrPeriod').textContent=key+' 期奖励';document.getElementById('qrHelp').textContent=`支持 PNG、JPEG 原图，最大 ${Math.round(qrMaxBytes/1024/1024)}MB。图片仅总管理员可查看，用于核对和打款。`;dialog.showModal()}
chooseQr.onclick=()=>picker.click();closeQr.onclick=()=>{if(!uploading){dialog.close();clearSelection()}};dialog.addEventListener('cancel',e=>{if(uploading)e.preventDefault();else clearSelection()});
picker.onchange=()=>{const file=picker.files?.[0];if(!file)return;clearPreview();qrStatus.textContent='';qrStatus.classList.remove('error');if(file.type&&!['image/png','image/jpeg'].includes(file.type)){qrStatus.textContent='请选择 PNG 或 JPEG 图片';qrStatus.classList.add('error');return}if(file.size>qrMaxBytes||!file.size){qrStatus.textContent=`请选择非空图片，最大 ${Math.round(qrMaxBytes/1024/1024)}MB`;qrStatus.classList.add('error');return}selectedFile=file;previewUrl=URL.createObjectURL(file);preview.src=previewUrl;preview.hidden=false;document.getElementById('fileName').textContent=file.name;sendQr.disabled=false};
function clearPreview(){if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl='';selectedFile=null;preview.hidden=true;preview.removeAttribute('src');document.getElementById('fileName').textContent='尚未选择图片';sendQr.disabled=true}
sendQr.onclick=async()=>{if(uploading||!selectedFile)return;uploading=true;sendQr.disabled=chooseQr.disabled=closeQr.disabled=true;qrStatus.textContent='正在安全提交收款码…';qrStatus.classList.remove('error');try{await call('/api/my/weekly-reward/qr?period='+encodeURIComponent(selectedPeriod),{method:'POST',headers:{'Content-Type':selectedFile.type||'application/octet-stream'},body:selectedFile});dialog.close();clearSelection();statusEl.textContent='收款码已私密提交，仅总管理员可查看图片';statusEl.classList.remove('error');if(loading&&pendingLoad)await pendingLoad.catch(()=>{});await load(true)}catch(e){qrStatus.textContent=e.message;qrStatus.classList.add('error')}finally{uploading=false;sendQr.disabled=!selectedFile;chooseQr.disabled=closeQr.disabled=false}};
async function load(silent=false){if(loading)return;loading=true;refresh.disabled=true;root.setAttribute('aria-busy','true');if(!silent){statusEl.textContent='正在更新排行榜…';statusEl.classList.remove('error')}try{const d=await (pendingLoad=call('/api/leaderboard'));draw(d);hasData=true;if(!silent||statusEl.classList.contains('error')){statusEl.textContent='排行榜已更新';statusEl.classList.remove('error')}}catch(e){statusEl.classList.add('error');statusEl.textContent=e.message+'，请点“刷新排行榜”重试。'+(hasData?' 当前保留上次读取的榜单。':'');if(!hasData)root.innerHTML='<section class="panel empty">排行榜暂时无法读取，请稍后刷新。</section>'}finally{loading=false;refresh.disabled=false;root.setAttribute('aria-busy','false')}}
refresh.onclick=()=>load();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!dialog.open&&!uploading)load()});setInterval(()=>{if(!document.hidden&&!dialog.open&&!uploading)load(true)},60000);load();
</script></body></html>
