<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>接单排行榜 · Aevon校园</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="ui.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#1f2937;font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}header{background:#1e3a8a;color:#fff;padding:14px 18px}nav,main{max-width:900px;margin:auto}nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}nav a{color:#fff;text-decoration:none}main{padding:26px 16px}h1{margin:0;font-size:27px}.sub,small{color:#64748b}.panel{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:18px;margin:16px 0}.period{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}.period h2{font-size:19px;margin:0}.hint{background:#eff6ff;color:#1e40af;padding:12px 14px;border-radius:10px;margin:14px 0}.prize{color:#b45309;font-weight:700}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:#f8fafc;border-radius:10px;padding:11px 13px}.rank{font-size:19px;font-weight:700;color:#1e3a8a}.muted{font-size:13px;color:#64748b}.btn{border:0;border-radius:9px;padding:9px 13px;background:#1e3a8a;color:white;font:inherit;cursor:pointer}.btn:disabled{opacity:.55}.upload{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status{min-height:24px;color:#166534}.empty{padding:18px;color:#64748b;text-align:center}.row.mine{outline:2px solid #bfdbfe}@media(max-width:520px){main{padding:20px 12px}.panel{padding:14px}.row{grid-template-columns:38px 1fr;gap:7px}.row .row-action{grid-column:2}}
</style></head><body><header><nav><a href="index.html">🎓 Aevon校园交流网</a><span><a href="tasks.html">未接订单</a> · <a href="me.html">个人中心</a></span></nav></header><main><h1>🏆 接单排行榜</h1><p class="sub">按任务完成时间统计。北京时间周一 01:00 开始，周日 01:00 截止。</p><div id="content"><p class="empty">正在读取排行榜…</p></div><p id="status" class="status" role="status" aria-live="polite"></p></main><script src="session.js"></script><script src="config.js"></script><script src="pwa.js" defer></script><script>
const API=window.API_BASE||'',token=localStorage.getItem('token'),root=document.getElementById('content'),statusEl=document.getElementById('status'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=x=>new Date(x).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
async function call(path,opt={}){const headers={...(opt.headers||{})};if(token)headers.Authorization='Bearer '+token;const r=await fetch(API+path,{...opt,headers}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'请求失败');return d}
const award=r=>r.rank<=3?(r.eligible?'现金奖励 ¥'+r.cash:'未达现金奖励条件（每周需完成 20 单）'):r.rank<=10?'5 积分': '—';
function rows(list,key,locked){return list.length?`<div class="rows">${list.map(r=>`<div class="row ${r.mine?'mine':''}"><div class="rank">${r.rank===1?'🥇':r.rank===2?'🥈':r.rank===3?'🥉':r.rank}</div><div><b>${esc(r.username)}${r.mine?'（我）':''}</b><div class="muted">完成 ${r.count} 个任务 · <span class="prize">${award(r)}</span></div></div><div class="row-action">${locked&&r.mine&&r.rank<=3&&r.eligible?(r.rewardStatus==='paid'?'<span class="muted">已登记打款</span>':`<button class="btn" type="button" data-qr="${esc(key)}">${r.qrSubmitted?'重新提交收款码':'提交收款码'}</button>`):''}</div></div>`).join('')}</div>`:'<div class="empty">本期还没有已完成任务</div>'}
function draw(d){let html='';if(d.live)html+=`<section class="panel"><div class="period"><h2>本周实时排行</h2><span class="muted">统计至 ${date(d.live.endAt)}</span></div><div class="hint">前三名需本周完成至少 20 个任务才可获得 ¥10、¥5、¥3 鼓励金。第 4 至 10 名各得 5 积分，于下周一 01:00 发放。</div>${rows(d.live.rows,d.live.key,false)}</section>`;
if(d.locked)html+=`<section class="panel"><div class="period"><h2>上期结算结果</h2><span class="muted">${date(d.locked.startAt)} 至 ${date(d.locked.endAt)} · ${d.locked.pointsSent?'积分已发放':'积分将在下周一 01:00 发放'}</span></div><div class="hint">现金奖励由管理员人工打款，将在周日 24:00 前处理。收款码仅本人和总管理员可查看。</div>${rows(d.locked.rows,d.locked.key,true)}</section>`;
if(!d.live&&!d.locked)html='<section class="panel empty">当前还没有排行榜记录。</section>';
const due=(d.myRewards||[]).filter(r=>r.status!=='paid');if(due.length&&!d.locked?.rows.some(r=>r.mine&&r.rank<=3&&r.eligible))html+=`<section class="panel"><h2>我的待领取奖励</h2>${due.map(r=>`<p>第 ${r.rank} 名 · ¥${r.cash} · ${r.qrSubmitted?'收款码已提交':'请提交收款码'}</p><button class="btn" type="button" data-qr="${esc(r.key)}">${r.qrSubmitted?'重新提交收款码':'提交收款码'}</button>`).join('')}</section>`;
root.innerHTML=html;root.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>upload(b.dataset.qr,b));}
async function upload(key,button){if(!token){location.href='login.html?next=leaderboard.html';return}const picker=document.createElement('input');picker.type='file';picker.accept='image/png,image/jpeg';picker.setAttribute('aria-label','选择收款码图片');picker.onchange=async()=>{const file=picker.files?.[0];if(!file)return;if(file.size>300*1024){statusEl.textContent='图片不能超过 300KB';return}button.disabled=true;statusEl.textContent='正在安全提交收款码…';try{await call('/api/my/weekly-reward/qr',{method:'POST',headers:{'Content-Type':file.type},body:file});statusEl.textContent='收款码已私密提交，仅总管理员可查看';await load()}catch(e){statusEl.textContent=e.message}finally{button.disabled=false}};picker.click()}
async function load(){root.innerHTML='<p class="empty">正在读取排行榜…</p>';try{draw(await call('/api/leaderboard'))}catch(e){root.innerHTML=`<section class="panel">加载失败：${esc(e.message)} <button class="btn" type="button" id="retry">重新加载</button></section>`;document.getElementById('retry').onclick=load}}
load();setInterval(()=>{if(!document.hidden)load()},60000);
</script></body></html>
