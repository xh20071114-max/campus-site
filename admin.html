<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · Aevon校园交流网</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Aevon校园"><meta name="theme-color" content="#1e3a8a"><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#1f2937}
a{color:inherit;text-decoration:none}
header{background:#1e3a8a;color:#fff;position:sticky;top:0;z-index:9}
.bar{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex-wrap:wrap;gap:6px}
.logo{font-size:20px;font-weight:bold}nav a{margin-left:20px;opacity:.9;white-space:nowrap}

.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}.tabs button{white-space:nowrap;flex:none}.tabs button{border:none;background:#e5e7eb;padding:9px 20px;border-radius:20px;cursor:pointer;font-size:15px}
.tabs button.on{background:#1e3a8a;color:#fff}
.bk{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:-6px 0 12px;font-size:13px;color:#6b7280}
@media(max-width:640px){main{padding:16px 12px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow:visible}.tabs button{padding:8px 2px;font-size:13px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{background:none;box-shadow:none;padding:0;overflow:visible}.box table{min-width:0!important}.box thead{display:none}.box table,.box tbody,.box tr,.box td{display:block;width:100%}
.box tr{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:10px 14px;margin-bottom:10px}.box td{border:none;padding:4px 0;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;text-align:right;white-space:normal!important}
.box td[data-l]{justify-content:flex-end;align-items:center}.box td[data-l]::before{content:attr(data-l);color:#9ca3af;flex:none;text-align:left;font-size:13px;margin-right:auto}.box td.txt{display:block;text-align:left}.box td.txt::before{display:block;margin-bottom:2px}
.box td.ops{justify-content:flex-end;gap:6px;border-top:1px solid #f3f4f6;margin-top:6px;padding-top:8px}.box td.ops::before{content:none}.box td.empty,.box td[colspan]{display:block;text-align:center}.box td[colspan]::before{content:none}}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select,.box input,.box textarea{padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;font-family:inherit}
.tools input{flex:1;min-width:200px}
.box{background:#fff;border-radius:12px;padding:6px 0;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #f0f1f4;vertical-align:top}
th{color:#6b7280;font-weight:normal;white-space:nowrap}td.txt{max-width:420px;word-break:break-all}
.tg{font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap;display:inline-block;margin:1px 2px 1px 0}
.b{background:#eef2ff;color:#3730a3}.r{background:#fee2e2;color:#b91c1c}.g{background:#dcfce7;color:#166534}.y{background:#fef3c7;color:#92400e}.x{background:#f3f4f6;color:#6b7280}
.act{border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;white-space:nowrap}.danger{background:#fee2e2;color:#b91c1c}.ok{background:#dcfce7;color:#166534}.kill{background:#dc2626;color:#fff;margin-left:6px}
.new{padding:16px;display:grid;gap:8px;border-bottom:1px solid #f0f1f4}.new button{justify-self:end;background:#1e3a8a;color:#fff;border:none;padding:8px 18px;border-radius:8px;cursor:pointer}
.empty{padding:30px;text-align:center;color:#9ca3af}.count{color:#6b7280;font-size:13px;margin:-6px 0 10px}
.need{background:#fff;border-radius:12px;padding:50px;text-align:center}.need a{display:inline-block;margin-top:14px;background:#1e3a8a;color:#fff;padding:10px 24px;border-radius:8px}
.cm{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}.cw{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column}.cw h3{padding:14px 18px;border-bottom:1px solid #eef0f4;font-size:16px;display:flex;justify-content:space-between;gap:10px}.cw h3 small{color:#6b7280;font-weight:normal;display:block;margin-top:2px;word-break:break-all}.cw h3 button{border:none;background:#f3f4f6;border-radius:8px;padding:4px 12px;cursor:pointer;align-self:start}.cl{overflow:auto;padding:14px 18px;flex:1}.ci{margin-bottom:12px}.ci .h{font-size:12px;color:#6b7280;margin-bottom:3px}.ci .h b{color:#1f2937}.ci .b{background:#f3f4f6;border-radius:10px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;font-size:14px;display:inline-block;max-width:100%}.ci.p .b{background:#dbeafe}.ro{font-size:12px;color:#9ca3af;text-align:center;padding:8px;border-top:1px solid #eef0f4}
.cs{text-align:center;color:#9ca3af;font-size:12px;margin:8px 0}.cimg{display:block;max-width:180px;max-height:180px;margin-top:6px;border-radius:8px;border:1px solid #e5e7eb;cursor:zoom-in;object-fit:cover}.act.warn2{background:#fff7ed;color:#c2410c;border-color:#fdba74}</style><link rel="stylesheet" href="ui.css"></head><body class="ui-site ui-admin">
<header><div class="bar"><a class="logo" href="index.html">🎓 Aevon校园交流网 · 管理后台</a>
<nav><a href="index.html">首页</a><a href="chat.html">项目频道</a><a href="me.html">个人中心</a></nav></div></header>
<main id="main"><p class="empty">加载中…</p></main>
<script src="session.js"></script>
<script src="config.js"></script>
<script>
const API=window.API_BASE||'',token=localStorage.getItem('token');
const CHANNELS=['校园跑','校园配送','代取快递','代课','代做作业'];
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const M=document.getElementById('main');
const call=async(path,opt={})=>{const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||('请求失败 '+r.status)),{status:r.status});return d};
let tab='users',users=[],msgs=[],anns=[],renderVersion=0;
let adminMe=null,roleFingerprint='';
const roleEditor={selected:'',query:'',drafts:new Map()};
const can=k=>!!adminMe&&(adminMe.superAdmin||adminMe.permissions.includes(k));
const userAccess=()=>['viewUsers','banUsers','deleteUsers','managePoints'].some(can);
const chatAccess=()=>can('viewChats')||can('joinChats');
const messageAccess=()=>can('viewMessages')||can('deleteMessages');
const roleStamp=m=>JSON.stringify([m.admin,m.superAdmin,m.permissions]);
const canTarget=u=>!u.superAdmin&&(adminMe.superAdmin||!u.admin);
const messageState={q:'',channel:'',filter:'',page:1};let messageQueryVersion=0;

function stop(title,text,link){M.innerHTML=`<div class="need"><h2>${title}</h2><p style="color:#6b7280;margin-top:8px">${text}</p>${link||''}</div>`}

async function init(){
  if(!token)return stop('请先登录','管理后台只有管理员能进入','<a href="login.html?next=admin.html">去登录</a>');
  let me;try{me=await call('/api/me')}catch(e){
    if(e.status===401){localStorage.removeItem('token');localStorage.removeItem('username');return stop('登录已过期','请重新登录','<a href="login.html?next=admin.html">去登录</a>')}
    return stop('⚠️ 网络连接失败','请检查网络后重试','<a href="#" onclick="location.reload();return false">重试</a>')}
  if(!me.admin)return stop('没有权限','只有管理员能进入管理后台','<a href="index.html">回首页</a>');
  adminMe=me;roleFingerprint=roleStamp(me);
  const tabs=[['users','👥 用户',userAccess()],['roles','🔑 授权管理',me.superAdmin],['msgs','💬 消息',messageAccess()],['anns','📢 公告',can('manageAnnouncements')],['rch','💰 充值审核',can('manageRecharges')],['rewards','🏆 奖励结算',me.superAdmin],['set','⚙️ 积分设置',can('manageSettings')],['chats','💬 私聊',chatAccess()],['fb','💡 建议/联系',can('manageFeedback'),'fbN'],['rpt','🚩 举报',can('manageReports'),'rpN'],['dsp','⚠️ 纠纷',can('manageDisputes'),'dsN']].filter(x=>x[2]);
  tab=tabs.some(x=>x[0]===tab)?tab:(tabs[0]?.[0]||'access');
  M.innerHTML=`<p class="count">${me.superAdmin?'总管理员':'管理员'}：${esc(me.username)} · ${me.superAdmin?'只有你可以分配管理权限':'仅可使用总管理员授予的权限'}</p><div class="tabs">${tabs.map(([id,label,_,badge])=>`<button data-t="${id}">${label}${badge?`<span id="${badge}"></span>`:''}</button>`).join('')}</div><div class="bk"><span id="disk"></span>${me.superAdmin?'<span><small style="color:#b91c1c">⚠️ 备份含全部用户数据，请勿外传</small> <button type="button" id="bkBtn" class="act ok" title="下载 data.json，不包含聊天图片">⬇️ 下载备份</button></span>':''}</div><div id="pane"></div>`;
  if(me.superAdmin)document.getElementById('bkBtn').onclick=downloadBackup;
  M.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  render();
}

async function render(){
  const version=++renderVersion,active=tab;
  M.querySelectorAll('.tabs button').forEach(b=>b.className=b.dataset.t===tab?'on':'');
  const P=document.getElementById('pane');P.innerHTML='<p class="empty">加载中…</p>';
  try{
    const fresh=await call('/api/me');if(version!==renderVersion)return;if(roleStamp(fresh)!==roleFingerprint){location.reload();return}
    const endpoint={users:'/api/admin/users',anns:'/api/announcements'}[active];
    const [o,data]=await Promise.all([call('/api/admin/overview?summary=1'),endpoint?call(endpoint):null]);
    if(version!==renderVersion)return;
    if(active==='users'){users=data;drawUsers()}if(active==='msgs')await drawMsgs(version);if(active==='anns'){anns=data.slice().sort((a,b)=>b.id-a.id);drawAnns()}
    if(active==='roles')await drawRoles(version);if(active==='access')P.innerHTML='<div class="need"><h2>管理权限已生效</h2><p>你获授的权限在项目频道中使用。如需其他权限，请联系总管理员。</p><a href="chat.html">进入项目频道</a></div>';
    if(active==='rch')await drawRch(version);if(active==='rewards')await drawWeeklyRewards(version);if(active==='set')await drawSet(version);if(active==='fb')await drawFb(version);if(active==='chats')await drawChats(version);if(active==='rpt')await drawRpt(version);if(active==='dsp')await drawDsp(version);
    if(version!==renderVersion)return;
    const badge=n=>n?` <span style="background:#dc2626;color:#fff;border-radius:9px;padding:0 6px;font-size:12px">${n}</span>`:'';
    const nd=o.disputes??msgs.filter(m=>m.task&&m.status==='disputed'&&!m.deleted).length,dn=document.getElementById('dsN');if(dn)dn.innerHTML=badge(Number(nd)|0);
    const dk=o.disk||{},ub=dk.uploads??dk.uploadBytes,db_=dk.data??dk.dataBytes,lim=dk.uploadsMax??dk.uploadLimit??500*1024*1024,de=document.getElementById('disk');
    const mb=x=>(Number(x)/1048576).toFixed(1)+' MB';if(de)de.textContent=ub==null&&db_==null?'':`💾 图片 ${ub!=null?mb(ub):'—'} / ${mb(lim)}${db_!=null?' · 数据 '+mb(db_):''}${dk.backups!=null?' · 备份 '+mb(dk.backups):''}${dk.free!=null?' · 磁盘剩余 '+mb(dk.free)+(dk.size?' / '+mb(dk.size):''):''}`;
    if(de&&ub!=null)de.style.color=Number(ub)>lim*0.8?'#b91c1c':'#6b7280';
    const ur=o.unreadReports|0,rn=document.getElementById('rpN');if(rn)rn.innerHTML=ur?` <span style="background:#dc2626;color:#fff;border-radius:9px;padding:0 6px;font-size:12px">${ur}</span>`:'';
    const un=o.unreadFeedback|0,fn=document.getElementById('fbN');if(fn)fn.innerHTML=un?` <span style="background:#dc2626;color:#fff;border-radius:9px;padding:0 6px;font-size:12px">${un}</span>`:'';
  }catch(e){if(version===renderVersion)P.innerHTML=`<p class="empty">加载失败：${esc(e.message)}</p>`}
}

// 只有总管理员可进入；账号 ID 和版本防止旧页面覆盖新授权或同名新账号。
async function drawRoles(version){
  const d=await call('/api/admin/roles');if(version!==renderVersion)return;const P=document.getElementById('pane');
  P.innerHTML='<div class="tools"><input id="roleQuery" aria-label="搜索授权账号" placeholder="输入用户名快速搜索"><select id="roleSelect" aria-label="选择授权账号" style="max-width:100%;min-width:180px"></select></div><p class="count" id="roleCount"></p><p class="count">一次只设置一个账号。勾选后点击“保存权限”生效；撤销全部权限可恢复普通用户。</p><div id="roleList" style="display:grid;gap:12px"></div>';
  const list=document.getElementById('roleList'),query=document.getElementById('roleQuery'),select=document.getElementById('roleSelect'),count=document.getElementById('roleCount');query.value=roleEditor.query;
  const draw=()=>{list.innerHTML='';const u=d.users.find(x=>x.userId===select.value);if(!u){list.innerHTML='<p class="empty">没有符合条件的用户</p>';return}roleEditor.selected=u.userId;{
    const card=document.createElement('section');card.className='box';card.style.cssText='padding:16px;overflow:visible';
    card.innerHTML=`<h3 style="margin-bottom:8px">${esc(u.username)} <span class="tg ${u.superAdmin?'r':u.admin?'b':'x'}">${u.superAdmin?'总管理员':u.admin?'管理员':'普通用户'}</span>${u.banned?'<span class="tg r">已封禁</span>':''}</h3>`;
    if(u.superAdmin){card.insertAdjacentHTML('beforeend','<p class="count" style="margin:0">你是总管理员，已拥有全部权限，无须勾选。</p>');list.append(card);return}
    if(u.banned){const notice=document.createElement('p');notice.style.cssText='padding:12px;background:#fff7ed;color:#9a3412;border-radius:8px;margin-bottom:12px';notice.textContent='此账号已封禁，因此权限框不可勾选。请先在“用户”中解封，再回来授权；也可直接撤销已有权限。';const go=document.createElement('button');go.type='button';go.className='act';go.textContent='前往用户管理';go.onclick=async()=>{tab='users';await render();const q=document.getElementById('uq');if(q){q.value=u.username;q.dispatchEvent(new Event('input'))}};notice.append(document.createElement('br'),go);card.append(notice)}
    let draft=roleEditor.drafts.get(u.userId),conflict=false;if(draft&&draft.version!==u.permissionsVersion){roleEditor.drafts.delete(u.userId);draft=null;conflict=true}const chosen=draft?draft.permissions:u.permissions;
    const form=document.createElement('form');form.style.display='grid';form.style.gap='10px';
    for(const group of [...new Set(d.catalog.map(x=>x.group))]){const field=document.createElement('fieldset');field.style.cssText='border:1px solid #e5e7eb;border-radius:8px;padding:10px;min-width:0';const legend=document.createElement('legend');legend.textContent=group;field.append(legend);
      for(const p of d.catalog.filter(x=>x.group===group)){const label=document.createElement('label');label.style.cssText='display:flex;gap:12px;align-items:start;margin:4px 0;padding:10px 4px;min-height:44px;cursor:pointer;touch-action:manipulation';const input=document.createElement('input');input.type='checkbox';input.name=p.key;input.checked=chosen.includes(p.key);input.disabled=u.banned;input.style.cssText='width:22px;height:22px;padding:0;margin:1px 0 0;flex:none;accent-color:#1e3a8a';const text=document.createElement('span');text.innerHTML=`${esc(p.label)}<small style="display:block;color:#6b7280">${esc(p.description)}</small>`;label.append(input,text);field.append(label)}form.append(field)}
    const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;bottom:8px;z-index:2;background:white;padding:10px 0;box-shadow:0 -4px 10px #ffffff';row.innerHTML='<button type="submit" class="act ok">保存权限</button><button type="button" class="act danger">撤销全部权限</button><span role="status" style="font-size:13px"></span>';
    const save=row.querySelector('[type=submit]'),revoke=row.querySelector('[type=button]'),status=row.querySelector('[role=status]');save.disabled=u.banned;
    const selection=()=>[...form.querySelectorAll('input:checked')].map(x=>x.name);status.textContent=conflict?'权限已被更新，请重新核对后勾选':draft?'已恢复未保存的勾选':'';
    form.onchange=()=>{roleEditor.drafts.set(u.userId,{version:u.permissionsVersion,permissions:selection()});status.textContent='已勾选 '+selection().length+' 项，点击保存生效'};
    const submit=async clear=>{const permissions=clear?[]:selection();save.disabled=revoke.disabled=true;form.querySelectorAll('input').forEach(x=>x.disabled=true);status.textContent='保存中…';try{const r=await call(`/api/admin/users/${encodeURIComponent(u.username)}/permissions`,{method:'POST',body:JSON.stringify({permissions,userId:u.userId,version:u.permissionsVersion})});u.permissions=r.permissions;u.admin=r.admin;u.permissionsVersion=r.permissionsVersion;roleEditor.drafts.delete(u.userId);form.querySelectorAll('input').forEach(x=>x.checked=u.permissions.includes(x.name));status.textContent=permissions.length?'已保存，权限立即生效':'已撤销，现为普通用户';card.querySelector('h3 .tg').textContent=u.admin?'管理员':'普通用户';{const option=[...select.options].find(x=>x.value===u.userId);if(option)option.textContent=u.username+(u.admin?'（管理员）':'')}}catch(e){status.textContent=e.message}finally{save.disabled=u.banned;revoke.disabled=false;form.querySelectorAll('input').forEach(x=>x.disabled=u.banned)}};
    form.onsubmit=e=>{e.preventDefault();submit(false)};revoke.onclick=()=>submit(true);form.append(row);card.append(form);list.append(card)}if(!list.children.length)list.innerHTML='<p class="empty">没有符合条件的用户</p>'};
  const filter=()=>{roleEditor.query=query.value;const q=query.value.trim().toLowerCase(),matches=d.users.filter(x=>x.username.toLowerCase().includes(q)).sort((a,b)=>Number(a.superAdmin)-Number(b.superAdmin)||a.username.localeCompare(b.username,'zh-CN'));select.replaceChildren();for(const u of matches){const option=document.createElement('option');option.value=u.userId;option.textContent=u.username+(u.superAdmin?'（总管理员）':u.banned?'（已封禁）':u.admin?'（管理员）':'');select.append(option)}const selected=matches.find(x=>x.username.toLowerCase()===q)||matches.find(x=>x.userId===roleEditor.selected)||matches[0];if(selected)select.value=selected.userId;select.disabled=!matches.length;count.textContent='找到 '+matches.length+' 个账号，请在上方选择';draw()};
  query.oninput=filter;select.onchange=draw;filter();
}
setInterval(async()=>{if(document.hidden||!adminMe)return;try{const me=await call('/api/me');if(roleStamp(me)!==roleFingerprint)location.reload()}catch(e){if(e.status===401||e.status===403)location.reload()}},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&adminMe)render()});

// 用户
function drawUsers(){
  const P=document.getElementById('pane');
  P.innerHTML=`<div class="tools"><input id="uq" placeholder="搜索用户名"><select id="uf"><option value="">全部用户</option><option value="ok">正常</option><option value="banned">已封禁</option></select></div><p class="count" id="uc"></p><div class="box"><table><thead><tr><th>用户名</th><th>注册时间</th><th>发帖</th><th>在线设备</th><th>积分</th><th>状态</th><th>操作</th></tr></thead><tbody id="ub"></tbody></table></div>`;
  const draw=()=>{const q=uq.value.trim().toLowerCase(),f=uf.value;
    const l=users.filter(u=>(!q||u.username.toLowerCase().includes(q))&&(!f||(f==='banned')===!!u.banned));
    uc.textContent=`共 ${l.length} 个用户`;
    ub.innerHTML=l.map(u=>`<tr><td><b>${esc(u.username)}</b> ${u.superAdmin?'<span class="tg r">总管理员</span>':u.admin?'<span class="tg b">管理员</span>':''}</td><td>${fmt(u.created)}</td><td>${u.messages??'-'}</td><td>${u.activeSessions||0}</td><td><b>${esc(u.points??'-')}</b> ${can('managePoints')&&(adminMe.superAdmin||!u.admin)?`<button class="act ok" data-u="${esc(u.username)}" data-a="points" title="手动加减积分">±</button>`:''}</td>
      <td>${u.banned?`<span class="tg r">已封禁</span>${u.banReason?`<br><small style="color:#6b7280">${esc(u.banReason)}</small>`:''}`:'<span class="tg g">正常</span>'}</td>
      <td>${!can('banUsers')||!canTarget(u)?'':u.banned?`<button class="act ok" data-u="${esc(u.username)}" data-a="unban">解封</button>`:`<button class="act danger" data-u="${esc(u.username)}" data-a="ban">封禁</button>`}${!can('deleteUsers')||!canTarget(u)?'':`<button class="act kill" data-u="${esc(u.username)}" data-a="delete">删除</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有符合条件的用户</td></tr>';

  <div class="box"><table><thead><tr><th>最后消息</th><th>任务</th><th>双方</th><th>最新一条</th><th>条数</th><th>操作</th></tr></thead><tbody id="cb"></tbody></table></div>`;
  const draw=()=>{const q=cq.value.trim().toLowerCase();
    const l=all.filter(c=>!q||[c.text,c.user,c.claimedBy,c.last&&c.last.user,c.last&&c.last.text].some(v=>String(v||'').toLowerCase().includes(q)));
    ccnt.textContent=`共 ${l.length} 个任务有私聊`;
    cb.innerHTML=l.map(c=>`<tr><td style="white-space:nowrap">${fmt(c.last&&c.last.time)}</td><td class="txt">${c.channel?`<span class="tg b">#${esc(c.channel)}</span> `:''}${esc(c.text||'（任务已不存在）')}</td>
    <td style="white-space:nowrap">${esc(c.user||'-')}<br><small style="color:#6b7280">接单：${esc(c.claimedBy||'无')}</small></td>
    <td class="txt"><small style="color:#6b7280">${esc(c.last&&c.last.user)}：</small>${esc(c.last&&c.last.text)}</td><td>${c.count|0}</td>
    <td><button class="act ok" data-chat="${esc(c.taskId)}" data-t="${esc(c.text||'')}">查看</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">还没有任务私聊</td></tr>';
    cb.querySelectorAll('button').forEach(b=>b.onclick=()=>openChat(b.dataset.chat,b.dataset.t))};
  cq.oninput=draw;draw();
}
init();
</script></body></html>
