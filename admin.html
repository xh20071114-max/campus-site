<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理后台 · Aevon校园交流网</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#1e3a8a"><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fb;color:#1f2937}
a{color:inherit;text-decoration:none}
header{background:#1e3a8a;color:#fff;position:sticky;top:0;z-index:9}
.bar{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;flex-wrap:wrap;gap:6px}
.logo{font-size:20px;font-weight:bold}nav a{margin-left:20px;opacity:.9;white-space:nowrap}
main{max-width:1200px;margin:0 auto;padding:24px 20px}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch}.tabs button{white-space:nowrap;flex:none}.tabs button{border:none;background:#e5e7eb;padding:9px 20px;border-radius:20px;cursor:pointer;font-size:15px}
.tabs button.on{background:#1e3a8a;color:#fff}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select,.box input,.box textarea{padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;font-family:inherit}
.tools input{flex:1;min-width:200px}
.box{background:#fff;border-radius:12px;padding:6px 0;box-shadow:0 2px 8px rgba(0,0,0,.05);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #f0f1f4;vertical-align:top}
th{color:#6b7280;font-weight:normal;white-space:nowrap}td.txt{max-width:420px;word-break:break-all}
.tg{font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap;display:inline-block;margin:1px 2px 1px 0}
.b{background:#eef2ff;color:#3730a3}.r{background:#fee2e2;color:#b91c1c}.g{background:#dcfce7;color:#166534}.y{background:#fef3c7;color:#92400e}.x{background:#f3f4f6;color:#6b7280}
.act{border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px;white-space:nowrap}.danger{background:#fee2e2;color:#b91c1c}.ok{background:#dcfce7;color:#166534}.kill{background:#dc2626;color:#fff;margin-left:6px}
.new{padding:16px;display:grid;gap:8px;border-bottom:1px solid #f0f1f4}.new button{justify-self:end;background:#1e3a8a;color:#fff;border:none;padding:8px 18px;border-radius:8px;cursor:pointer}
.empty{padding:30px;text-align:center;color:#9ca3af}.count{color:#6b7280;font-size:13px;margin:-6px 0 10px}
.need{background:#fff;border-radius:12px;padding:50px;text-align:center}.need a{display:inline-block;margin-top:14px;background:#1e3a8a;color:#fff;padding:10px 24px;border-radius:8px}
.cm{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}.cw{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column}.cw h3{padding:14px 18px;border-bottom:1px solid #eef0f4;font-size:16px;display:flex;justify-content:space-between;gap:10px}.cw h3 small{color:#6b7280;font-weight:normal;display:block;margin-top:2px;word-break:break-all}.cw h3 button{border:none;background:#f3f4f6;border-radius:8px;padding:4px 12px;cursor:pointer;align-self:start}.cl{overflow:auto;padding:14px 18px;flex:1}.ci{margin-bottom:12px}.ci .h{font-size:12px;color:#6b7280;margin-bottom:3px}.ci .h b{color:#1f2937}.ci .b{background:#f3f4f6;border-radius:10px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;font-size:14px;display:inline-block;max-width:100%}.ci.p .b{background:#dbeafe}.ro{font-size:12px;color:#9ca3af;text-align:center;padding:8px;border-top:1px solid #eef0f4}
</style></head><body>
<header><div class="bar"><a class="logo" href="index.html">🎓 Aevon校园交流网 · 管理后台</a>
<nav><a href="index.html">首页</a><a href="chat.html">项目频道</a><a href="me.html">个人中心</a></nav></div></header>
<main id="main"><p class="empty">加载中…</p></main>
<script src="config.js"></script>
<script>
const API=window.API_BASE||'',token=localStorage.getItem('token');
const CHANNELS=['校园跑','食堂配送','代取快递','代课'];
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('zh-CN',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const M=document.getElementById('main');
const call=async(path,opt={})=>{const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token}});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||('请求失败 '+r.status)),{status:r.status});return d};
let tab='users',users=[],msgs=[],anns=[];

function stop(title,text,link){M.innerHTML=`<div class="need"><h2>${title}</h2><p style="color:#6b7280;margin-top:8px">${text}</p>${link||''}</div>`}

async function init(){
  if(!token)return stop('请先登录','管理后台只有管理员能进入','<a href="login.html?next=admin.html">去登录</a>');
  let me;try{me=await call('/api/me')}catch(e){
    if(e.status===401){localStorage.removeItem('token');localStorage.removeItem('username');return stop('登录已过期','请重新登录','<a href="login.html?next=admin.html">去登录</a>')}
    return stop('⚠️ 网络连接失败','请检查网络后重试','<a href="#" onclick="location.reload();return false">重试</a>')}
  if(!me.admin)return stop('没有权限','只有管理员能进入管理后台','<a href="index.html">回首页</a>');
  M.innerHTML=`<div class="tabs"><button data-t="users">👥 用户</button><button data-t="msgs">💬 消息</button><button data-t="anns">📢 公告</button><button data-t="rch">💰 充值审核</button><button data-t="set">⚙️ 积分设置</button><button data-t="chats">💬 私聊</button><button data-t="fb">💡 建议<span id="fbN"></span></button></div><div id="pane"></div>`;
  M.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  render();
}

async function render(){
  M.querySelectorAll('.tabs button').forEach(b=>b.className=b.dataset.t===tab?'on':'');
  const P=document.getElementById('pane');P.innerHTML='<p class="empty">加载中…</p>';
  try{
    const o=await call('/api/admin/overview');
    msgs=Object.entries(o.channels||{}).flatMap(([c,l])=>l.map(m=>({...m,channel:c})));
    const cnt={};msgs.forEach(m=>cnt[m.user]=(cnt[m.user]||0)+1);
    users=(o.users||[]).map(u=>({...u,messages:cnt[u.username]||0}));
    anns=(o.announcements||[]).slice().sort((a,b)=>b.id-a.id);
    if(tab==='users')drawUsers();if(tab==='msgs')drawMsgs();if(tab==='anns')drawAnns();if(tab==='rch')await drawRch();if(tab==='set')await drawSet();if(tab==='fb')await drawFb();if(tab==='chats')await drawChats();
    const un=o.unreadFeedback|0,fn=document.getElementById('fbN');if(fn)fn.innerHTML=un?` <span style="background:#dc2626;color:#fff;border-radius:9px;padding:0 6px;font-size:12px">${un}</span>`:'';
  }catch(e){P.innerHTML=`<p class="empty">加载失败：${esc(e.message)}</p>`}
}

// 用户
function drawUsers(){
  const P=document.getElementById('pane');
  P.innerHTML=`<div class="tools"><input id="uq" placeholder="搜索用户名"><select id="uf"><option value="">全部用户</option><option value="ok">正常</option><option value="banned">已封禁</option></select></div><p class="count" id="uc"></p><div class="box"><table><thead><tr><th>用户名</th><th>注册时间</th><th>发帖</th><th>在线设备</th><th>积分</th><th>状态</th><th>操作</th></tr></thead><tbody id="ub"></tbody></table></div>`;
  const draw=()=>{const q=uq.value.trim().toLowerCase(),f=uf.value;
    const l=users.filter(u=>(!q||u.username.toLowerCase().includes(q))&&(!f||(f==='banned')===!!u.banned));
    uc.textContent=`共 ${l.length} 个用户`;
    ub.innerHTML=l.map(u=>`<tr><td><b>${esc(u.username)}</b> ${u.admin?'<span class="tg r">管理员</span>':''}</td><td>${fmt(u.created)}</td><td>${u.messages??'-'}</td><td>${u.activeSessions||0}</td><td><b>${esc(u.points??'-')}</b> <button class="act ok" data-u="${esc(u.username)}" data-a="points" title="手动加减积分">±</button></td>
      <td>${u.banned?`<span class="tg r">已封禁</span>${u.banReason?`<br><small style="color:#6b7280">${esc(u.banReason)}</small>`:''}`:'<span class="tg g">正常</span>'}</td>
      <td>${u.admin?'':u.banned?`<button class="act ok" data-u="${esc(u.username)}" data-a="unban">解封</button>`:`<button class="act danger" data-u="${esc(u.username)}" data-a="ban">封禁</button>`}${u.admin?'':`<button class="act kill" data-u="${esc(u.username)}" data-a="delete">删除</button>`}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">没有符合条件的用户</td></tr>';
    ub.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const a=b.dataset.a,n=b.dataset.u;
      if(a==='points'){const v=prompt(`给「${n}」加减积分：\n填正数加分，负数扣分，例如 5 或 -3`,'');if(v===null)return;const delta=Number(v.trim());
        if(!Number.isInteger(delta)||delta===0)return alert('请填一个不为 0 的整数');const reason=prompt('原因（会记进他的积分明细）：','管理员调整');if(reason===null)return;
        try{await call(`/api/admin/users/${encodeURIComponent(n)}/points`,{method:'POST',body:JSON.stringify({delta,reason:reason.trim()})});render()}catch(e){alert(e.message)}return}
      let body={};if(a==='delete'&&!confirm(`确定删除账号「${n}」吗？\n\n删除后不可恢复：他会立即下线，发过的消息会被标记为已删除（管理员仍能看到原文），他发布的未完成任务会被撤销，接下的未完成任务会放回待接单。删除后这个用户名可以被重新注册。`))return;
      if(a==='ban'){const r=prompt(`封禁「${n}」后，他不能登录、发消息和接单。\n封禁原因（选填）：`,'');if(r===null)return;body={reason:r.trim()}}
      try{const d=await call(`/api/admin/users/${encodeURIComponent(n)}/${a}`,{method:'POST',body:JSON.stringify(body)});
        if(a==='delete'&&d.deleted)alert(`已删除账号「${n}」：${d.messages||0} 条消息标为已删除，撤销 ${d.cancelledTasks||0} 个任务，${d.releasedTasks||0} 个任务放回待接单。`);render()}catch(e){alert(e.message)}})};
  uq.oninput=draw;uf.onchange=draw;draw();
}

// 消息（含已删除、已撤销）
function mState(m){const t=[];if(m.official)t.push('<span class="tg r">官方</span>');if(m.task)t.push('<span class="tg b">任务</span>');
  if(m.deleted)t.push('<span class="tg x">已删除</span>');else if(m.cancelled)t.push('<span class="tg x">已撤销</span>');
  else if(m.done||m.doneAt)t.push('<span class="tg g">已完成</span>');else if(m.claimedBy)t.push(`<span class="tg y">${esc(m.claimedBy)} 已接单</span>`);
  else if(m.task&&m.expired)t.push('<span class="tg x">已过期</span>');else if(m.task)t.push('<span class="tg y">待接单</span>');return t.join('')}
function drawMsgs(){
  const P=document.getElementById('pane');
  P.innerHTML=`<div class="tools"><input id="mq" placeholder="搜索内容或用户名"><select id="mc"><option value="">全部频道</option>${CHANNELS.map(c=>`<option>${c}</option>`).join('')}</select>
  <select id="mf"><option value="">全部消息</option><option value="task">只看任务</option><option value="note">只看非任务（频道公告、旧聊天）</option><option value="live">正常显示中</option><option value="gone">已删除或已撤销</option></select></div><p class="count" id="mcnt"></p>
  <div class="box"><table><thead><tr><th>时间</th><th>频道</th><th>用户</th><th>内容</th><th>状态</th><th>操作</th></tr></thead><tbody id="mb"></tbody></table></div>`;
  const draw=()=>{const q=mq.value.trim().toLowerCase(),c=mc.value,f=mf.value;
    const l=msgs.filter(m=>(!c||m.channel===c)&&(!q||String(m.text||m.deletedText||'').toLowerCase().includes(q)||String(m.user).toLowerCase().includes(q))
      &&(!f||(f==='task'&&m.task)||(f==='note'&&!m.task)||(f==='live'&&!m.deleted&&!m.cancelled)||(f==='gone'&&(m.deleted||m.cancelled)))).sort((a,b)=>b.id-a.id);
    mcnt.textContent=`共 ${l.length} 条`;
    mb.innerHTML=l.slice(0,500).map(m=>{const text=m.deleted?(m.deletedText||'（内容已清空）'):m.text;
      const extra=[m.reward&&'💰'+m.reward,m.place&&'📍'+m.place,m.deadline&&'⏰'+fmt(m.deadline)].filter(Boolean).join('　');
      return `<tr><td style="white-space:nowrap">${fmt(m.time)}</td><td><span class="tg b">#${esc(m.channel)}</span></td><td>${esc(m.user)}</td>
      <td class="txt">${m.task?'':'<span class="tg" style="background:#ede9fe;color:#6d28d9">📢 非任务</span> '}${esc(text)}${extra?`<br><small style="color:#6b7280">${esc(extra)}</small>`:''}</td><td>${mState(m)}</td>
      <td style="white-space:nowrap">${m.task&&(m.claimedBy||m.chatCount)?`<button class="act ok" data-chat="${m.id}" data-t="${esc(m.text||m.deletedText||'')}">💬 私聊${m.chatCount?' '+(m.chatCount|0):''}</button> `:''}${m.deleted?'':`<button class="act danger" data-c="${esc(m.channel)}" data-id="${m.id}">删除</button>`}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">没有符合条件的消息</td></tr>';
    mb.querySelectorAll('button[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat,b.dataset.t));
    mb.querySelectorAll('button[data-c]').forEach(b=>b.onclick=async()=>{if(!confirm('确定删除这条消息？'))return;
      try{await call(`/api/channels/${encodeURIComponent(b.dataset.c)}/messages/${b.dataset.id}/delete`,{method:'POST'});render()}catch(e){alert(e.message)}})};
  mq.oninput=draw;mc.onchange=draw;mf.onchange=draw;draw();
}

// 公告
function drawAnns(){
  const P=document.getElementById('pane');
  P.innerHTML=`<div class="box"><form class="new" id="af"><b>发布新公告</b><input id="at" maxlength="60" placeholder="公告标题" required><textarea id="ax" rows="3" maxlength="2000" placeholder="公告内容（选填）"></textarea><button>发布</button></form>
  <table><thead><tr><th>时间</th><th>标题和内容</th><th>操作</th></tr></thead><tbody>${anns.map(a=>`<tr><td style="white-space:nowrap">${fmt(a.time)}</td><td class="txt"><b>${esc(a.title)}</b>${a.text?`<br><span style="color:#6b7280">${esc(a.text)}</span>`:''}</td>
  <td><button class="act danger" data-id="${a.id}">删除</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">还没有公告</td></tr>'}</tbody></table></div>`;
  af.onsubmit=async e=>{e.preventDefault();try{await call('/api/announcements',{method:'POST',body:JSON.stringify({title:at.value.trim(),text:ax.value.trim()})});render()}catch(e){alert(e.message)}};
  P.querySelectorAll('tbody button').forEach(b=>b.onclick=async()=>{if(!confirm('确定删除这条公告？'))return;
    try{await call(`/api/announcements/${b.dataset.id}/delete`,{method:'POST'});render()}catch(e){alert(e.message)}});
}
// 充值审核
let rchF='pending';
async function drawRch(){
  const P=document.getElementById('pane');const d=await call('/api/admin/recharges');
  const all=(Array.isArray(d)?d:(d.recharges||d.list||[])).slice().sort((a,b)=>new Date(b.time||b.created||0)-new Date(a.time||a.created||0));
  const st=r=>String(r.status||'pending');
  const tag=s=>s==='approved'?'<span class="tg g">已通过</span>':s==='rejected'?'<span class="tg r">已拒绝</span>':'<span class="tg" style="background:#fef3c7;color:#92400e">待审核</span>';
  const np=all.filter(r=>st(r)==='pending').length;
  P.innerHTML=`<div class="tools"><select id="rf"><option value="pending">待审核（${np}）</option><option value="approved">已通过</option><option value="rejected">已拒绝</option><option value="">全部</option></select></div>
  <p class="count">核对收款记录后再通过；通过时填写要给的积分。</p><div class="box"><table><thead><tr><th>时间</th><th>用户</th><th>金额</th><th>备注</th><th>状态</th><th>操作</th></tr></thead><tbody id="rb"></tbody></table></div>`;
  rf.value=rchF;
  const draw=()=>{rchF=rf.value;const l=all.filter(r=>!rchF||st(r)===rchF);
    rb.innerHTML=l.map(r=>`<tr><td style="white-space:nowrap">${fmt(r.time||r.created)}</td><td><b>${esc(r.user||r.username)}</b></td><td>¥${esc(r.amount)}<br><small style="color:#6b7280">${r.method==='wechat'?'微信':r.method==='alipay'?'支付宝':''}</small></td><td class="txt">${esc(r.note||'')}</td>
    <td>${tag(st(r))}${st(r)==='approved'?` +${esc(r.points??'')}`:''}${r.reason?`<br><small style="color:#6b7280">${esc(r.reason)}</small>`:''}</td>
    <td style="white-space:nowrap">${st(r)==='pending'?`<button class="act ok" data-id="${esc(r.id)}" data-a="approve" data-m="${esc(r.amount)}" data-u="${esc(r.user||r.username)}">通过</button> <button class="act danger" data-id="${esc(r.id)}" data-a="reject" data-u="${esc(r.user||r.username)}">拒绝</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有记录</td></tr>';
    rb.querySelectorAll('button').forEach(b=>b.onclick=async()=>{const id=encodeURIComponent(b.dataset.id),u=b.dataset.u;let body={};
      if(b.dataset.a==='approve'){const v=prompt(`通过「${u}」的充值 ¥${b.dataset.m}\n给多少积分？`,'');if(v===null)return;const points=Number(v.trim());
        if(!Number.isInteger(points)||points<=0)return alert('积分要填正整数');body={points}}
      else{const r=prompt(`拒绝「${u}」的充值，原因（选填，用户能看到）：`,'');if(r===null)return;body={reason:r.trim()}}
      try{await call(`/api/admin/recharges/${id}/${b.dataset.a}`,{method:'POST',body:JSON.stringify(body)});render()}catch(e){alert(e.message)}})};
  rf.onchange=draw;draw();
}

// 积分设置
async function drawSet(){
  const P=document.getElementById('pane');const d=await call('/api/admin/settings');const s=d.settings||d;
  const F=[['postCost','发布任务扣的积分','普通用户每发一个任务扣多少'],['claimCost','接单扣的积分','普通用户每接一单扣多少'],['signupBonus','新注册赠送积分','只对之后注册的新用户生效']];
  P.innerHTML=`<div class="box"><form class="new" id="sf">${F.map(([k,l,h])=>`<label style="display:grid;gap:4px"><b style="font-size:14px">${l}</b><input id="s_${k}" type="number" min="0" step="1" value="${esc(s[k]??'')}" required><small style="color:#6b7280">${h}</small></label>`).join('')}
  <button>保存设置</button><small id="sm" style="color:#166534"></small></form></div>`;
  sf.onsubmit=async e=>{e.preventDefault();const body={};for(const[k]of F){const v=Number(document.getElementById('s_'+k).value);if(!Number.isInteger(v)||v<0)return alert('请填 0 或正整数');body[k]=v}
    try{await call('/api/admin/settings',{method:'POST',body:JSON.stringify(body)});sm.textContent='✅ 已保存'}catch(e){alert(e.message)}};
}
// 建议
let fbF='';
async function drawFb(){
  const P=document.getElementById('pane');const d=await call('/api/admin/feedback');
  const all=(Array.isArray(d)?d:(d.feedback||d.list||[])).slice().sort((a,b)=>new Date(b.time||0)-new Date(a.time||0));
  const nu=all.filter(f=>!f.read).length;
  P.innerHTML=`<div class="tools"><select id="ff"><option value="">全部（${all.length}）</option><option value="unread">未读（${nu}）</option><option value="read">已读</option></select></div>
  <div class="box"><table><thead><tr><th>时间</th><th>用户</th><th>建议</th><th>联系方式</th><th>操作</th></tr></thead><tbody id="fbb"></tbody></table></div>`;
  ff.value=fbF;
  const draw=()=>{fbF=ff.value;const l=all.filter(f=>!fbF||(fbF==='read')===!!f.read);
    fbb.innerHTML=l.map(f=>`<tr style="${f.read?'':'background:#fffbeb'}"><td style="white-space:nowrap">${fmt(f.time)}${f.read?'':'<br><span class="tg r">未读</span>'}</td><td><b>${esc(f.user)}</b></td>
    <td class="txt" style="white-space:pre-wrap">${esc(f.text)}</td><td>${esc(f.contact||'')}</td>
    <td style="white-space:nowrap">${f.read?'':`<button class="act ok" data-id="${esc(f.id)}" data-a="read">标为已读</button> `}<button class="act danger" data-id="${esc(f.id)}" data-a="delete">删除</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">还没有建议</td></tr>';
    fbb.querySelectorAll('button').forEach(b=>b.onclick=async()=>{if(b.dataset.a==='delete'&&!confirm('确定删除这条建议？删除后不可恢复'))return;
      try{await call(`/api/admin/feedback/${encodeURIComponent(b.dataset.id)}/${b.dataset.a}`,{method:'POST'});render()}catch(e){alert(e.message)}})};
  ff.onchange=draw;draw();
}
// 任务私聊（管理员只读）
async function openChat(id,title){
  const w=document.createElement('div');w.className='cm';
  w.innerHTML='<div class="cw"><h3><span>💬 任务私聊<small></small></span><button type="button">关闭</button></h3><div class="cl"><p class="empty">加载中…</p></div><div class="ro">管理员只能查看，不能发言</div></div>';
  w.querySelector('small').textContent=title||('任务 #'+id);
  const esc_=e=>{if(e.key==='Escape')close()};const close=()=>{w.remove();document.removeEventListener('keydown',esc_)};
  w.querySelector('h3 button').onclick=close;w.onclick=e=>{if(e.target===w)close()};document.addEventListener('keydown',esc_);
  document.body.appendChild(w);const L=w.querySelector('.cl');
  let d;try{d=await call(`/api/tasks/${encodeURIComponent(id)}/chat`)}catch(e){L.innerHTML='';L.textContent='加载失败：'+e.message;return}
  const list=Array.isArray(d)?d:(d.messages||[]);const poster=d.poster||(d.task&&d.task.user);
  L.innerHTML='';if(!list.length){L.innerHTML='<p class="empty">这个任务还没有私聊消息</p>';return}
  list.forEach(m=>{const u=m.user||'';const isP=poster&&u===poster&&!m.userDeleted;const it=document.createElement('div');it.className='ci'+(isP?' p':'');
    const h=document.createElement('div');h.className='h';const b=document.createElement('b');b.textContent=(m.userDeleted?u+'（已注销）':u)+(isP?' · 发布人':(m.claimer?' · 接单人':''));h.appendChild(b);h.appendChild(document.createTextNode('  '+fmt(m.time)));
    const t=document.createElement('div');t.className='b';t.textContent=m.text||'';it.appendChild(h);it.appendChild(t);L.appendChild(it)});
  L.scrollTop=L.scrollHeight;
}
// 私聊列表（管理员只读）
async function drawChats(){
  const P=document.getElementById('pane');const d=await call('/api/admin/chats');const all=Array.isArray(d)?d:(d.chats||[]);
  P.innerHTML=`<div class="tools"><input id="cq" placeholder="搜索任务内容、用户名或聊天内容"></div><p class="count" id="ccnt"></p>
  <div class="box"><table><thead><tr><th>最后消息</th><th>任务</th><th>双方</th><th>最新一条</th><th>条数</th><th>操作</th></tr></thead><tbody id="cb"></tbody></table></div>`;
  const draw=()=>{const q=cq.value.trim().toLowerCase();
    const l=all.filter(c=>!q||[c.text,c.user,c.claimedBy,c.last&&c.last.user,c.last&&c.last.text].some(v=>String(v||'').toLowerCase().includes(q)));
    ccnt.textContent=`共 ${l.length} 个任务有私聊`;
    cb.innerHTML=l.map(c=>`<tr><td style="white-space:nowrap">${fmt(c.last&&c.last.time)}</td><td class="txt">${c.channel?`<span class="tg b">#${esc(c.channel)}</span> `:''}${esc(c.text||'（任务已不存在）')}</td>
    <td style="white-space:nowrap">${esc(c.user||'-')}<br><small style="color:#6b7280">接单：${esc(c.claimedBy||'无')}</small></td>
    <td class="txt"><small style="color:#6b7280">${esc(c.last&&c.last.user)}：</small>${esc(c.last&&c.last.text)}</td><td>${c.count|0}</td>
    <td><button class="act ok" data-chat="${esc(c.taskId)}" data-t="${esc(c.text||'')}">查看</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">还没有任务私聊</td></tr>';
    cb.querySelectorAll('button').forEach(b=>b.onclick=()=>openChat(b.dataset.chat,b.dataset.t))};
  cq.oninput=draw;draw();
}
init();
</script></body></html>
