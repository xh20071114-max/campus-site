<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · Aevon校园交流网</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2f6fed,#6d28d9)}
.box{background:#fff;border-radius:14px;padding:32px;width:340px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
h1{font-size:22px;text-align:center;margin-bottom:20px}
.tabs{display:flex;margin-bottom:18px}.tabs button{flex:1;padding:8px;border:none;background:#f3f4f6;cursor:pointer}
.tabs button.on{background:#2f6fed;color:#fff}
input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:12px;font-size:15px}
.go{width:100%;padding:11px;background:#2f6fed;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}
#err{color:#dc2626;font-size:14px;min-height:20px;margin-bottom:6px}
a{display:block;text-align:center;margin-top:14px;color:#6b7280;font-size:14px}
</style>
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Aevon校园"><script src="pwa.js" defer></script><meta name="theme-color" content="#1e3a8a"></head>
<body>
<div class="box">
  <h1>🎓 Aevon校园交流网</h1>
  <div class="tabs"><button id="tL" class="on">登录</button><button id="tR">注册</button></div>
  <form id="f">
    <input id="u" placeholder="用户名" required autocomplete="username" maxlength="16">
    <input id="p" type="password" placeholder="密码" required autocomplete="current-password">
    <input id="p2" type="password" placeholder="确认密码" style="display:none" autocomplete="new-password">
    <div id="tip" style="display:none;font-size:13px;color:#6b7280;margin:-4px 0 10px;line-height:1.6">用户名 2-16 位，只能用中文、字母、数字或下划线；密码至少 6 位。<br>注册即表示知悉：本站由总管理员管理，获授权的管理员可查看相应内容（包括私聊和已删除原文）；任务私聊只有发布人和接单人能发言。</div>
    <div id="err"></div>
    <button class="go" id="go">登录</button>
  </form>
  <a href="index.html">← 返回首页</a>
</div>
<script src="session.js"></script>
<script src="config.js"></script>
<script>
let mode='login';
function safeNext(value){try{const u=new URL(value||'index.html',location.href);return u.origin===location.origin&&/^\/(index|chat|me|recharge|admin|login)\.html$/.test(u.pathname)?u.pathname+u.search+u.hash:'index.html'}catch{return 'index.html'}}
function set(m){mode=m;tL.className=m==='login'?'on':'';tR.className=m==='register'?'on':'';
 p2.style.display=m==='register'?'block':'none';if(m!=='register')p2.value='';p2.required=m==='register';go.textContent=m==='login'?'登录':'注册';tip.style.display=m==='register'?'block':'none';p.autocomplete=m==='register'?'new-password':'current-password';err.textContent=''}
tL.onclick=()=>set('login');tR.onclick=()=>set('register');
f.onsubmit=async e=>{e.preventDefault();err.textContent='';
 if(go.disabled)return;
 if(mode==='register'){
  if(!/^[\u4e00-\u9fa5A-Za-z0-9_]{2,16}$/.test(u.value.trim())){err.textContent='用户名需 2-16 位，只能用中文、字母、数字或下划线';return}
  if(p.value.length<6){err.textContent='密码至少 6 位';return}
  if(p.value!==p2.value){err.textContent='两次输入的密码不一致';return}}
 go.disabled=tL.disabled=tR.disabled=true;
 try{const r=await fetch((window.API_BASE||'')+'/api/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(mode==='register'?{username:u.value.trim(),password:p.value,password2:p2.value}:{username:u.value.trim(),password:p.value})});
  const d=await r.json();if(!r.ok){err.textContent=r.status===429?'操作太频繁，请稍后再试':(d.error||'出错了');if(d.contact)err.textContent+=' 联系方式：'+d.contact;if(d.banned&&d.appealToken){err.textContent+='。'+(d.reason?'封禁原因：'+d.reason+'。':'');const appeal=document.createElement('button');appeal.type='button';appeal.textContent='联系管理员 / 申诉';appeal.onclick=()=>window.openSupport({token:d.appealToken});err.append(document.createElement('br'),appeal)}return}
  localStorage.setItem('token',d.token);localStorage.setItem('username',d.username);
  location.href=safeNext(new URLSearchParams(location.search).get('next'));
 }catch{err.textContent='网络连接失败，请检查网络后重试'}finally{go.disabled=tL.disabled=tR.disabled=false}};
fetch((window.API_BASE||'')+'/api/settings').then(r=>r.json()).then(d=>{const c=d&&d.contactInfo;if(!c)return;const p=document.createElement('p');p.style.cssText='margin-top:14px;font-size:13px;color:#6b7280;text-align:center;line-height:1.6';p.textContent='遇到问题（如账号被封禁）？请联系管理员：'+c;document.querySelector('.box').appendChild(p)}).catch(()=>{});
</script>
<script src="feedback.js"></script>
</body>
</html>
