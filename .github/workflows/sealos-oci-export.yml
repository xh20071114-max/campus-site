name: Temporary Sealos OCI export
on:
  push:
    branches:
      - codex/temporary-sealos-image-transfer
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout verified source commit
        uses: actions/checkout@v4
        with:
          ref: 3d65be1e5cdc7c3e01dde6d1f534728ed2f7aa46
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build OCI image for Sealos
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: aevon-campus:3d65be1e5cdc7c3e01dde6d1f534728ed2f7aa46
          build-args: APP_COMMIT=3d65be1e5cdc7c3e01dde6d1f534728ed2f7aa46
          outputs: type=oci,dest=/tmp/aevon-campus.oci.tar
      - name: Upload temporary OCI archive
        uses: actions/upload-artifact@v4
        with:
          name: aevon-campus-oci-3d65be1e5
          path: /tmp/aevon-campus.oci.tar
          if-no-files-found: error
          retention-days: 1
